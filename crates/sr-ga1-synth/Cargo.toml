[package]
name = "sr-ga1-synth"
version = "0.1.0"
edition = "2021"
description = "SystemVerilog synthesiser for the SR-GA1 FPGA fabric"

[[bin]]
name = "sr-ga1-synth"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
